<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0716">
  <meta name="description" content="Runenfall – Roguelite mit riesiger Sternenkarte, Glyphen-Builds und endlosem Fortschritt. Läuft offline.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Runenfall">
  <title>Runenfall</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="cv"></canvas>
  <canvas id="tree"></canvas>

  <div id="hud">
    <div class="h-top">
      <div class="h-bars">
        <div class="hpb"><i id="hpFill"></i><i id="barFill"></i><span id="hpTxt"></span></div>
        <div class="xpb"><i id="xpFill"></i></div>
      </div>
      <div class="h-info"><b id="hLvl"></b><span id="hTime"></span></div>
      <button class="icon" data-a="hpause" aria-label="Pause">❚❚</button>
    </div>
    <div id="hTitle"></div>
    <div id="hObj"></div>
    <div id="hBoss" class="hidden"><b id="hBossName"></b><div class="bossb"><i id="hBossFill"></i></div></div>
  </div>

  <div id="ui"></div>
  <div id="modal"></div>
  <div id="toast"></div>

  <noscript>Runenfall benötigt JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
